spring.application.name=backend

server.port=8080

spring.profiles.active=dev

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

spring.jpa.open-in-view=false

# Fraud Rule Engine
fraud.rules.large-transaction-threshold=50000
fraud.rules.unusual-amount-multiplier=3.0
fraud.rules.transactions-last-5-minutes-threshold=5
fraud.rules.transactions-last-1-hour-threshold=20
fraud.rules.failed-attempts-threshold=3

fraud.rules.large-transaction-points=25
fraud.rules.velocity-points=25
fraud.rules.unusual-amount-points=20
fraud.rules.activity-anomaly-points=15
fraud.rules.destination-risk-points=30