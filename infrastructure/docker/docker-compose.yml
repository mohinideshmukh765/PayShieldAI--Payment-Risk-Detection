services:

  postgres:
    image: postgres:16
    container_name: payshield-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: PayShieldAIDB
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mohini
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payshield -d payshield"]
      interval: 10s
      timeout: 5s
      retries: 5

  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    container_name: payshield-mlflow
    ports:
      - "5000:5000"
    command:
      - mlflow
      - server
      - --host
      - 0.0.0.0
      - --port
      - "5000"

volumes:
  postgres_data: